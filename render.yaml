services:
  - type: web
    name: agrixai
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: agrixai-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@agrixai.local
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: agrixai-db
    plan: free

services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: agri, POSTGRES_PASSWORD: "${DB_PASSWORD:-agri_pw}", POSTGRES_DB: agri}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U agri"], interval: 5s, retries: 10}
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://agri:${DB_PASSWORD:-agri_pw}@db:5432/agri
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agrixai.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}

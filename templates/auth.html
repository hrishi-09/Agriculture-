{% extends "base.html" %}{% from "base.html" import tbl %}{% block body %}<div class="auth">
<div class="hero"><h1>🌾 AgriXAI</h1><p>Transparent, explainable AI for crop decisions</p></div>
<div class="card"><form method="post"><input type="hidden" name="csrf" value="{{csrf}}">
{% if mode=='register' %}<input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password (min 8)" required><input name="confirm" type="password" placeholder="Confirm password" required><button>Create account</button>
<p><small>Have an account? <a href="/login" style="color:var(--g)">Sign in</a></small></p>
{% else %}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button>
<p><small>New here? <a href="/register" style="color:var(--g)">Register</a></small></p>{% endif %}</form></div></div>{% endblock %}
